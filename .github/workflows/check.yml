name: Check theme

# Läuft bei jedem Push und zusätzlich wöchentlich: Steam benennt seine
# CSS-Klassen bei Updates um – so fällt ein Bruch auf, bevor Nutzer ihn melden.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lint theme.json (DeckThemes rules)
        run: python3 tools/package_theme.py --lint

      - name: Classes exist in current Steam build + W3C CSS validation
        run: python3 preview/build_preview.py --check --validate
